name: AntenimYok
options:
  bundleIdPrefix: com.egeckmk
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AntenimYokCore:
    path: AntenimYokCore
targets:
  AntenimYok:
    type: application
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - AntenimYok
    dependencies:
      - package: AntenimYokCore
    info:
      path: AntenimYok/Resources/Info.plist
      properties:
        CFBundleDisplayName: Antenim Yok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # Many Turkish stations serve plain http: radio streams, .pls/.m3u playlists, ICY titles and logos.
        # NSAllowsArbitraryLoadsForMedia alone is not enough (URLSession fetches of http playlists fail with -1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: AntenimYok/Resources/AntenimYok.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.egeckmk.antenimyok
        PRODUCT_NAME: AntenimYok
        INFOPLIST_KEY_CFBundleDisplayName: Antenim Yok
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        SDKROOT: auto
schemes:
  AntenimYok:
    build:
      targets:
        AntenimYok: all
    test:
      targets: []
    run:
      config: Debug
